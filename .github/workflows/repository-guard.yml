name: Repository Guard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify repository integrity
      run: |
        test -f package.json
        test -f tsconfig.json
        test -f vite.config.ts
        test -f index.html
        echo "Integrity check passed."
